AWSTemplateFormatVersion: '2010-09-09'
Description: Preread document processing stack (S3 -> SQS -> Lambda -> RDS)

Parameters:
  UploadBucketName:
    Type: String
  DatabaseUrlSecretArn:
    Type: String
  BedrockModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  UploadQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 120

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref UploadBucketName
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:Put
            Queue: !GetAtt UploadQueue.Arn

  UploadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref UploadQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3SendMessage
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt UploadQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt UploadBucket.Arn

  ProcessDocumentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DocumentProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${UploadBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt UploadQueue.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseUrlSecretArn

  ProcessDocumentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: preread-process-document
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 120
      MemorySize: 1024
      Role: !GetAtt ProcessDocumentRole.Arn
      Code:
        S3Bucket: placeholder-artifacts-bucket
        S3Key: placeholder/process-document.zip
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_TEMPERATURE: '0'
          BEDROCK_TOKEN_EXPIRES_SECONDS: '43200'
          DATABASE_URL_SECRET_ARN: !Ref DatabaseUrlSecretArn
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId

  ProcessDocumentEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      EventSourceArn: !GetAtt UploadQueue.Arn
      FunctionName: !Ref ProcessDocumentFunction
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:
  UploadQueueArn:
    Value: !GetAtt UploadQueue.Arn
  UploadBucketNameOutput:
    Value: !Ref UploadBucket
