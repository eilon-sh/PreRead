name: Bootstrap Deploy Bucket

# Manually-triggered, one-time (idempotent) setup step. Creates and configures
# the S3 bucket used to stage CI/CD deployment artifacts (EC2 source bundles
# and Lambda zips). Safe to re-run - every step checks current state first.
#
# Prerequisite (not automatable - see infra-setup/bootstrap/README below):
#   infra-setup/bootstrap/grant-deploy-bucket-permissions.sh must have been run
#   once by an AWS admin, so the deploy role has permission to create and
#   configure this specific bucket.
#
# Prerequisite: repository variable DEPLOY_ARTIFACTS_BUCKET must be set to the
# exact bucket name produced by that script
# (preread-deploy-artifacts-<account-id>-<region>).

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: Create/configure deploy artifacts bucket
    runs-on: ubuntu-latest
    steps:
      - name: Validate required configuration
        run: |
          set -euo pipefail
          if [[ -z "${{ vars.DEPLOY_ARTIFACTS_BUCKET }}" ]]; then
            echo "::error::Repository variable DEPLOY_ARTIFACTS_BUCKET is not set. See infra-setup/bootstrap/."
            exit 1
          fi
          echo "Target bucket: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create bucket if it does not already exist
        env:
          BUCKET: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists - skipping creation."
          else
            echo "Creating bucket $BUCKET in $REGION..."
            if [[ "$REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
          fi

      - name: Block all public access
        env:
          BUCKET: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Enable default encryption
        env:
          BUCKET: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api put-bucket-encryption --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

      - name: Expire old deployment artifacts after 14 days
        env:
          BUCKET: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" \
            --lifecycle-configuration \
            '{"Rules":[{"ID":"expire-old-artifacts","Status":"Enabled","Filter":{},"Expiration":{"Days":14}}]}'

      - name: Done
        env:
          BUCKET: ${{ vars.DEPLOY_ARTIFACTS_BUCKET }}
        run: |
          echo "Deploy artifacts bucket ready: $BUCKET"
